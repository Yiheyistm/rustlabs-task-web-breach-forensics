version = "1.0"

[task]
name = "rustlabs/web-breach-forensics"
description = "Incident-response forensics on a compromised Debian host image. Investigate the filesystem to reconstruct a web-breach timeline: identify the injected payload, enumerate persistence mechanisms, and produce a structured incident report with 8 required facts. Then remediate the box by removing the malicious artifacts without breaking the legitimate system (6 cleanup actions). Feedback is scored as a fraction of 14 achieved checks correct."

[metadata]
name = "rustlabs/web-breach-forensics"
description = "Incident-response forensics on a compromised Debian host image. Investigate the filesystem to reconstruct a web-breach timeline: identify the injected payload, enumerate persistence mechanisms, and produce a structured incident report with 8 required facts. Then remediate the box by removing the malicious artifacts without breaking the legitimate system (6 cleanup actions). Feedback is scored as a fraction of 14 achieved checks correct."
difficulty = "hard"
category = "digital-forensics-incident-response"
tags = ["security", "ir", "forensics", "persistence", "cleanup", "logs"]

[agent]
timeout_sec = 72000.0

[verifier]
timeout_sec = 1200.0

[environment]
docker_image = "web-breach-forensics-task:latest"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 8192
gpus = 0
allow_internet = false
mcp_servers = []
